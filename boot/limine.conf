# Nocturne OS boot configuration. The boot loader does not choose the screen: the firmware's mode
# is the monitor's own preferred one (Limine reads its EDID), and the desktop's resolution and
# refresh rate are the system's (the display driver and Settings), never set here.
timeout: 3
interface_branding: Nocturne OS
interface_branding_colour: 5
term_palette: 0b0e1a;e0566b;6bd68b;e8c36a;6a8ce8;b57ce8;5cc8d6;c9cce0
term_palette_bright: 4a5070;ff7a8e;8ef0aa;ffdc8a;8eaeff;d3a0ff;85e8f2;ffffff
term_background: 0b0e1a
term_foreground: c9cce0

/Nocturne OS
    comment: Boot Nocturne with the graphical desktop.
    protocol: limine
    path: boot():/boot/kernel.elf

/Nocturne OS (text console only)
    comment: Skip the desktop and start a shell on the framebuffer console.
    protocol: limine
    path: boot():/boot/kernel.elf
    cmdline: nogui
