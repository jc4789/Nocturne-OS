<!doctype html>
<html lang="ja"><meta charset="utf-8">
<title>GPU 修理の実画面確認</title>
<style>
body { margin: 28px; background: #f3f5f9; color: #17243b; font: 20px sans-serif; }
section { background: white; padding: 20px; margin: 20px 0; border: 2px solid #a9b7ca; }
canvas { display: block; border: 2px solid #17243b; margin: 12px 0; }
button, input { font: inherit; padding: 10px; }
.space { height: 700px; background: linear-gradient(#dbe9fa, #f3f5f9); }
</style>
<h1>GPU 修理の実画面確認</h1>
<p>これは描画経路の局所試験です。NVIDIA 実機や性能改善の証明ではありません。</p>
<section>
<h2>512 を超える Canvas</h2>
<p>幅 641、高さ 97。左は赤、右は青。再描画すると左が緑になります。</p>
<canvas id="source" width="641" height="97"></canvas>
<canvas id="copy" width="641" height="97"></canvas>
<button id="redraw">再描画</button> <span id="paint">準備中</span>
</section>
<section>
<h2>WebGL と既存コンテキストの保持</h2>
<p>二つの独立したコンテキスト：上は赤、下は緑。</p>
<canvas id="first" width="240" height="97"></canvas>
<canvas id="second" width="240" height="97"></canvas>
<p id="glresult">準備中</p><p id="caveat">準備中</p>
</section>
<section><h2>実入力</h2>
<form id="form"><input id="entry" placeholder="文字を入力"><button>送信</button></form>
<p id="entered">未送信</p></section>
<div class="space"></div>
<section id="bottom"><h2>ページの下端</h2><p>PageDown でここまで移動し、PageUp で描画へ戻ることを確認します。</p></section>
<script>
const byId = id => document.getElementById(id);
let draws = 0;
function draw() {
  const source = byId('source'), copy = byId('copy');
  const a = source.getContext('2d'), b = copy.getContext('2d');
  a.fillStyle = draws ? '#00ff00' : '#ff0000'; a.fillRect(0, 0, 641, 97);
  a.fillStyle = '#0000ff'; a.fillRect(320, 0, 321, 97);
  b.drawImage(source, 0, 0);
  const left = b.getImageData(0, 0, 1, 1).data;
  const right = b.getImageData(640, 96, 1, 1).data;
  const good = left[draws ? 1 : 0] === 255 && right[2] === 255 && right[3] === 255;
  byId('paint').textContent = (good ? '画素一致' : '画素不一致') + ' / 再描画 ' + draws;
  console.log('GPU_BROWSER_CANVAS', good, draws, Array.from(left), Array.from(right));
  draws++;
}
draw();
byId('redraw').addEventListener('click', draw);
const first = byId('first').getContext('webgl', {preserveDrawingBuffer:true});
const second = byId('second').getContext('webgl', {preserveDrawingBuffer:true});
if (first && second) {
  first.clearColor(1,0,0,1); first.clear(first.COLOR_BUFFER_BIT);
  second.clearColor(0,1,0,1); second.clear(second.COLOR_BUFFER_BIT);
  const red = new Uint8Array(4), green = new Uint8Array(4);
  first.readPixels(0,0,1,1,first.RGBA,first.UNSIGNED_BYTE,red);
  second.readPixels(0,0,1,1,second.RGBA,second.UNSIGNED_BYTE,green);
  const good = red[0] === 255 && red[1] === 0 && green[0] === 0 && green[1] === 255;
  byId('glresult').textContent = (good ? '独立した画素を保持' : '画素不一致') + ' / ' + first.getParameter(first.RENDERER);
  console.log('GPU_BROWSER_WEBGL', good, Array.from(red), Array.from(green));
} else { byId('glresult').textContent = 'WebGL コンテキスト作成失敗'; console.log('GPU_BROWSER_WEBGL', false); }
const strict = document.createElement('canvas').getContext('webgl', {failIfMajorPerformanceCaveat:true});
byId('caveat').textContent = strict ? '重大な性能注意を拒否する要求：コンテキスト作成' : '重大な性能注意を拒否する要求：null（CPU 描画時の期待値）';
console.log('GPU_BROWSER_CAVEAT_CONTEXT', !!strict);
byId('form').addEventListener('submit', event => {
  event.preventDefault(); byId('entered').textContent = '受信：' + byId('entry').value;
});
</script></html>
